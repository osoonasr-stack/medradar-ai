
name: MedRadar Automatic Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run MedRadar
        run: python medradar.py

      - name: Save report
        run: |
          git config user.name "MedRadar Bot"
          git config user.email "medradar-bot@users.noreply.github.com"
          git add medradar.db reports/latest.md
          git diff --cached --quiet || git commit -m "Update MedRadar report"
          git push
